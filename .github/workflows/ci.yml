name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bloguser
          POSTGRES_PASSWORD: blogpass
          POSTGRES_DB: blogdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://bloguser:blogpass@localhost:5432/blogdb_test
      SYNC_DATABASE_URL: postgresql+psycopg2://bloguser:blogpass@localhost:5432/blogdb_test
      TEST_DATABASE_URL: postgresql+asyncpg://bloguser:blogpass@localhost:5432/blogdb_test
      SECRET_KEY: test_secret_key_for_ci
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ENDPOINT: localhost:9000
      MINIO_BUCKET: articles
      CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//
      MINIO_PUBLIC_URL: http://localhost:9000
      COOKIE_SECURE: false
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: noreply@blog.com
      EMBEDDING_DIM: 768
      OLLAMA_URL: http://localhost:11434
      OLLAMA_MODEL: nomic-embed-text
      GROQ_API_KEY: ""
      GROQ_URL: https://api.groq.com/openai/v1
      GROQ_MODEL: openai/gpt-oss-120b

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Test
        run: uv run pytest
