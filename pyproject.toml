[project]
name = "project-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ou", email = "ou@bk.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bandit>=1.9.4",
    "bcrypt>=5.0.0",
    "boto3>=1.43.91",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pre-commit>=4.6.1",
    "psycopg>=3.3.4",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "radon>=6.0.1",
    "ruff>=0.16.1",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
project-blog = "project_blog:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"


[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "app"]
extend-exclude = [".venv", "venv", "build", "dist", "__pycache__", "migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "src"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"     # "double" | "single"
indent-style = "space"
line-ending = "cr-lf"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"src/routing/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[dependency-groups]
dev = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
